<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>질문 유형별 처리 경로</title>
<style>
@font-face { font-family: 'Pretendard'; src: url('../../assets/fonts/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; font-display: block; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #FAFAF7; }
body { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #24272A; padding: 32px; }
h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.frame { width: 1280px; }
/* 폭을 지키고 좁은 화면에서는 이 상자만 가로로 스크롤한다 */
.diagram-container { width: 100%; overflow-x: auto; }
svg { width: 100%; min-width: 1280px; height: auto; display: block; }
svg text { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
@media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
<h1>질문 유형별 처리 경로</h1>
<div class="diagram-container">
<svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dd-ai-route-title dd-ai-route-desc"><title id="dd-ai-route-title">질문 유형별 처리 경로</title><desc id="dd-ai-route-desc">질문 일곱 가지가 업무 API, 문서 검색, 구조화 출력, 답 틀, 직원에게 넘김 다섯 경로 중 어디로 가는지와 그 까닭을 보인 흐름도.</desc><defs><marker id="dd-ai-route-arrow-m" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555A60"/></marker><marker id="dd-ai-route-arrow-p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2340A0"/></marker></defs><rect width="1280" height="700" fill="#FAFAF7"/><text x="40" y="40" font-size="12" font-weight="600" fill="#2340A0" text-anchor="start">Evenstay · 아키텍처 설계안</text><text x="40" y="74" font-size="28" font-weight="700" fill="#24272A" text-anchor="start">질문 유형별 처리 경로</text><text x="40" y="100" font-size="14" font-weight="400" fill="#555A60" text-anchor="start">숫자와 상태는 원장에서, 조항은 문서에서 답한다. 판단은 사람이 한다.</text><rect x="1118" y="22" width="122" height="24" rx="3" fill="#FAFAF7" stroke="#555A60" stroke-width="0.8" stroke-dasharray="4,3"/><text x="1179.0" y="38.5" font-size="12" font-weight="600" fill="#555A60" text-anchor="middle">설계안, 구현 아님</text><text x="40" y="140" font-size="13" font-weight="700" fill="#555A60" text-anchor="start">질문</text><line x1="40" y1="150" x2="440" y2="150" stroke="#D2D4CE" stroke-width="1"/><text x="560" y="140" font-size="13" font-weight="700" fill="#555A60" text-anchor="start">경로</text><line x1="560" y1="150" x2="880" y2="150" stroke="#D2D4CE" stroke-width="1"/><text x="940" y="140" font-size="13" font-weight="700" fill="#555A60" text-anchor="start">까닭</text><line x1="940" y1="150" x2="1240" y2="150" stroke="#D2D4CE" stroke-width="1"/><path d="M440 196 L560 196" fill="none" stroke="#2340A0" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-p)"/><path d="M440 264 L560 264" fill="none" stroke="#2340A0" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-p)"/><path d="M440 332 L560 332" fill="none" stroke="#2340A0" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-p)"/><path d="M440 400 L560 400" fill="none" stroke="#2340A0" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-p)"/><path d="M440 468 L560 468" fill="none" stroke="#2340A0" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-p)"/><path d="M440 536 L560 536" fill="none" stroke="#2340A0" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-p)"/><path d="M440 604 L560 604" fill="none" stroke="#555A60" stroke-width="1.4" marker-end="url(#dd-ai-route-arrow-m)"/><rect x="40" y="168" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="201" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">이번 달 청구 금액, 수납 상태</text><rect x="40" y="236" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="269" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">기간에 빈 호실</text><rect x="40" y="304" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="337" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">계약서 해지 조항</text><rect x="40" y="372" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="405" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">운영 규정의 절차</text><rect x="40" y="440" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="473" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">계약서의 날짜, 보증금 추출</text><rect x="40" y="508" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="541" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">회원의 날짜와 청구 질문</text><rect x="40" y="576" width="400" height="56" rx="6" fill="#FEFEFC" stroke="#D2D4CE" stroke-width="1"/><text x="60" y="609" font-size="15" font-weight="600" fill="#24272A" text-anchor="start">건강, 금전, 계약 판단</text><rect x="560" y="168" width="320" height="124" rx="6" fill="#E8EDF8" stroke="#2340A0" stroke-width="1.4"/><text x="580" y="228" font-size="16" font-weight="700" fill="#24272A" text-anchor="start">업무 API</text><text x="580" y="248" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">숫자와 상태는 원장에서</text><line x1="880" y1="230" x2="928" y2="230" stroke="#D2D4CE" stroke-width="1"/><text x="940" y="220" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">현재 원장 값이 필요하다. 기간과 동시성 규칙이</text><text x="940" y="240" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">필요하다.</text><rect x="560" y="304" width="320" height="124" rx="6" fill="#E8EDF8" stroke="#2340A0" stroke-width="1.4"/><text x="580" y="364" font-size="16" font-weight="700" fill="#24272A" text-anchor="start">문서 검색</text><text x="580" y="384" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">직원용. 버전과 권한을 적용한다</text><line x1="880" y1="366" x2="928" y2="366" stroke="#D2D4CE" stroke-width="1"/><text x="940" y="356" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">원문과 조항 근거가 필요하다. 유효한 규정이어야</text><text x="940" y="376" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">한다.</text><rect x="560" y="440" width="320" height="56" rx="6" fill="#FEFEFC" stroke="#2340A0" stroke-width="1.4"/><text x="580" y="466" font-size="16" font-weight="700" fill="#24272A" text-anchor="start">구조화 출력</text><text x="580" y="486" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">+ 사람 확인</text><line x1="880" y1="468" x2="928" y2="468" stroke="#D2D4CE" stroke-width="1"/><text x="940" y="468" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">검색 인덱스 없이도 된다.</text><rect x="560" y="508" width="320" height="56" rx="6" fill="#FEFEFC" stroke="#2340A0" stroke-width="1.4"/><text x="580" y="534" font-size="16" font-weight="700" fill="#24272A" text-anchor="start">답 틀</text><text x="580" y="554" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">의도 분류 + 도구</text><rect x="804" y="512" width="58" height="20" rx="3" fill="#F3D766" stroke="#24272A" stroke-width="0.8"/><text x="833.0" y="526.5" font-size="12" font-weight="700" fill="#24272A" text-anchor="middle">ADR-G1</text><line x1="880" y1="536" x2="928" y2="536" stroke="#D2D4CE" stroke-width="1"/><text x="940" y="536" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">회원에게 보이는 답은 틀에 채워 만든다.</text><rect x="560" y="576" width="320" height="56" rx="6" fill="#F6ECDA" stroke="#9A5B00" stroke-width="1.4"/><text x="580" y="602" font-size="16" font-weight="700" fill="#24272A" text-anchor="start">직원에게 넘김</text><text x="580" y="622" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">사람이 판단한다</text><line x1="880" y1="604" x2="928" y2="604" stroke="#D2D4CE" stroke-width="1"/><text x="940" y="604" font-size="13" font-weight="400" fill="#24272A" text-anchor="start">건강, 금전, 계약 판단은 사람이 한다.</text><line x1="40" y1="662" x2="1240" y2="662" stroke="#D2D4CE" stroke-width="1"/><text x="40" y="682" font-size="12" font-weight="600" fill="#555A60" text-anchor="start">범례</text><rect x="92" y="670" width="24" height="14" rx="3" fill="#E8EDF8" stroke="#2340A0" stroke-width="1"/><text x="124" y="682" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">조회로 답하는 경로</text><rect x="255" y="670" width="24" height="14" rx="3" fill="#FEFEFC" stroke="#2340A0" stroke-width="1"/><text x="287" y="682" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">틀과 확인을 거치는 경로</text><rect x="445" y="670" width="24" height="14" rx="3" fill="#F6ECDA" stroke="#9A5B00" stroke-width="1"/><text x="477" y="682" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">사람에게 넘기는 경로</text></svg>
</div>
</div>
