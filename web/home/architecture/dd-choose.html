or="middle">회사에 정해진 표준이</text><text x="380" y="256" font-size="14" font-weight="600" fill="#24272A" text-anchor="middle">있나?</text><circle cx="170" cy="240" r="11" fill="#2340A0"/><text x="170" y="244.5" font-size="13" font-weight="700" fill="#FEFEFC" text-anchor="middle">1</text><rect x="700" y="208" width="540" height="64" rx="20" fill="#E8EDF8" stroke="#2340A0" stroke-width="1"/><text x="722" y="236" font-size="15" font-weight="700" fill="#24272A" text-anchor="start">그 표준을 따른다</text><text x="722" y="257" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">회사에 정해진 클라우드, 언어, 네트워크 표준</text><polygon points="380,336 540,388 380,440 220,388" fill="#FEFEFC" stroke="#24272A" stroke-width="1.2"/><text x="380" y="384" font-size="14" font-weight="600" fill="#24272A" text-anchor="middle">실제 데이터 없이 화면</text><text x="380" y="404" font-size="14" font-weight="600" fill="#24272A" text-anchor="middle">검증이 먼저인가?</text><circle cx="170" cy="388" r="11" fill="#2340A0"/><text x="170" y="392.5" font-size="13" font-weight="700" fill="#FEFEFC" text-anchor="middle">2</text><rect x="700" y="356" width="540" height="64" rx="20" fill="#E8EDF8" stroke="#2340A0" stroke-width="1"/><text x="722" y="384" font-size="15" font-weight="700" fill="#24272A" text-anchor="start">C안 빠른 파일럿</text><text x="722" y="405" font-size="12" font-weight="400" fill="#555A60" text-anchor="start">Vercel + Supabase. 2단계 전에 A안이나 B안으로 옮긴다</text><polygon points="380,484 540,536 380,588 220,536" fill="#FEFEFC" stroke="#24272A" stroke-width="1.2"/><text x="380" y="532" font-size="14" font-weight="600" fill="#24272A" text-anchor="middle">코어를 맡을 사람이</text><text x="380" y="552" font-size="14" font-weight="600" fill="#24272A" text-anchor="middle">JVM인가?</text><circle cx="170" cy="536" r="11" fill="#2340A0"/><text x="170" y="540.5" font-size="13" font-weight="700" fill="#FEFEFC" text-anchor="middle">3</text><rect x="700" y="504" width="540" height="64" rx="20" fill="#F3D766" stroke="#24272A" stroke-width="1.4"/><t
